<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account · School Management System</title>
    <link rel="stylesheet" href="register.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"> -->
</head>
<body>

    <div class="modal" id="101">
        <div class="whole">
            <form action="register.php" method="post">
                <div class="container">
                    <span onclick="window.location.href='index.php'" class="close">&times;</span>

                    <h1>Sign Up</h1>
                    <p>Please fill this form to create an account.</p>
                    <hr>

                    <div class="e">
                        <label for="name">Name:</label>
                    </div>
                    <input type="text" name="name" id="name" placeholder="Name" required>

                    <div class="e">
                        <label for="phone">Phone:</label>
                    </div>
                    <input type="tel" name="phone" id="phone" placeholder="Phone Number">

                    <div class="e">
                        <label for="email">Email:</label>
                    </div>
                    <input type="email" name="email" id="email" placeholder="Email" required>

                    <div class="role-box">
                        <label for="role">Register As:</label>
                        <select name="role" id="role" onchange="toggleTeacherField()" required>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>

                    <div class="teacher-box" id="teacherField" style="display: none;">
                        <label for="teacher_id">Teacher ID:</label>
                        <input type="text" name="teacher_id" id="teacher_id" placeholder="Enter Teacher ID">
                    </div>

                    <div class="f">
                        <label for="password">Password:</label>
                    </div>
                    <input type="password" name="password" id="password" placeholder="Password" required>

                    <div class="f">
                        <label for="conpass">Confirm Password:</label>
                    </div>
                    <input type="password" name="conpass" id="conpass" placeholder="Confirm Password" required>

                    <div class="rem">
                        <input type="checkbox" name="agree" id="agree" required>
                        <span>By creating this account you agree to our <a href="terms.html">Terms &amp; Privacy</a></span>
                    </div>

                    <button type="submit" class="btn">
                        Create Account
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <div class="divider">
                        <span>OR</span>
                    </div>

                    <p class="rt">
                        Already have an account? <a href="login.html">Login</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script src="src/register.js"></script>
</body>
</html>
